name: Build Windows portable

# 打一个 v* 标签就自动构建并发布，不需要在本机跑打包
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（必须已存在，例如 v1.8.1）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npm run build:portable

      - name: List output
        shell: pwsh
        run: Get-ChildItem dist-exe -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Checksum
        shell: bash
        run: sha256sum dist-exe/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: 勘波 WaveScout ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist-exe/*.exe
          fail_on_unmatched_files: true
          body: |
            Windows 10 / 11 x64 单文件便携版，双击即用，无需安装任何运行环境。

            ### 主要功能
            - 平面图 WiFi 覆盖规划：导入图纸、标定比例尺、画墙体、摆放 AP
            - 五档热力图 + 覆盖率统计 + 鼠标位置实时 RSSI
            - 同频重叠判定（频率区间相交 + 双方信号强度）
            - 多楼宇多楼层、框选批量编辑
            - 中国 SRRC / 澳洲 ACMA 射频标准一键切换

            ### 安装
            下载下方的 `.exe` 附件，双击运行。

            - 首次启动会自解压到临时目录，约 3~5 秒
            - 无代码签名，Windows SmartScreen 提示时选「更多信息 → 仍要运行」
            - 不需要安装 .NET、VC++ 运行库或任何环境

            ### 已知限制
            - 热力图按整张图纸计算，AP 较多时开启会有可感知停顿
            - 吸附是坐标对齐，不是拓扑绑定
            - 仅支持 Windows x64

            使用说明见 [README](https://github.com/dellzou/wavescout#readme)，完整介绍见 [作者博客](https://xiaozou123.cn/wavescout-wifi-coverage-planner/)。
